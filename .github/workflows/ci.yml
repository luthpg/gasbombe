name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run actionlint (Workflow Lint)
        uses: reviewdog/action-actionlint@v1.77.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: any

      - name: Lint & Format Check (Biome)
        run: pnpm run check:ci

      - name: Type Check
        run: pnpm run tsc

      - name: Build
        run: pnpm run build

      - name: Run Tests (Vitest)
        run: pnpm run test
