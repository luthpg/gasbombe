<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= projectName %></title>
    <script>
      let userAddress = "mock-user@example.com";
      try {
        const serverParams = JSON.parse(
          '<?!= typeof parameters !== "undefined" ? parameters : "{}" ?>',
        );
        if (serverParams && serverParams.userAddress) {
          userAddress = serverParams.userAddress;
        }
      } catch {
        // Fallback for local development or when parameters are not provided
      }
      window.userAddress = userAddress;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
